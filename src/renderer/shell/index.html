<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Julia Desktop</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app" class="app-shell" data-mode="text">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">J</div>
          <div>
            <div class="brand-title">Julia</div>
            <div class="brand-subtitle">Desktop V2</div>
          </div>
        </div>

        <nav class="mode-switch" aria-label="Interaction mode">
          <button id="textModeButton" class="mode-button active" type="button">Text</button>
          <button id="voiceModeButton" class="mode-button" type="button">Voice</button>
        </nav>

        <div class="status-pill" title="Electron shell does not own the media pipeline">
          <span class="status-dot"></span>
          Clean shell
        </div>
      </header>

      <main class="surface-root">
        <section id="textSurface" class="surface text-surface" aria-label="Text mode">
          <aside class="sidebar">
            <button id="newChatButton" class="new-chat-button" type="button">+ New Chat</button>
            <label class="search-label" for="conversationSearch">Search</label>
            <input id="conversationSearch" class="search-input" placeholder="Search conversations" />

            <div id="conversationList" class="conversation-list">
            </div>

            <div id="emptyConversationList" class="conversation-group muted">
              <div class="group-title">Today</div>
              <div class="empty-sidebar">No saved conversations yet.</div>
            </div>
          </aside>

          <section class="conversation-panel">
            <div id="conversationThread" class="thread">
            </div>

            <form id="composerForm" class="composer">
              <button class="composer-plus" type="button" aria-label="Attach" disabled>+</button>
              <input id="composerInput" class="composer-input" placeholder="Message Julia..." autocomplete="off" />
              <button id="composerVoiceButton" class="composer-voice" type="button" aria-label="Switch to voice">🎙</button>
              <button id="composerSend" class="composer-send" type="submit" disabled>↑</button>
            </form>
          </section>
        </section>

        <section id="voiceSurface" class="surface voice-surface hidden" aria-label="Voice mode">
          <button id="backToTextButton" class="back-button" type="button">← Text</button>
          <div class="voice-center">
            <div class="voice-orb" aria-hidden="true"></div>
            <h1>Julia Voice</h1>
            <p class="voice-state">Validated Golden Voice Shell</p>
            <p class="voice-note">
              Voice is still served by the existing HF Web Voice path. This App Shell does not transport audio.
            </p>
            <button id="openVoiceButton" class="primary-action" type="button">Open Voice Shell</button>
            <div id="voiceUrlLabel" class="voice-url"></div>
          </div>
        </section>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
