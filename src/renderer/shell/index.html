<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Julia Desktop</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app" class="app-shell" data-mode="text">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">J</div>
          <div>
            <div class="brand-title">Julia</div>
            <div class="brand-subtitle">Desktop V2</div>
          </div>
        </div>

        <nav class="mode-switch" aria-label="Interaction mode">
          <button id="textModeButton" class="mode-button active" type="button">Text</button>
          <button id="voiceModeButton" class="mode-button" type="button">Voice</button>
        </nav>

        <div class="topbar-actions">
          <button id="settingsButton" class="settings-button" type="button">Settings</button>
          <button id="brainStatusButton" class="status-pill" type="button" title="Julia Brain status">
            <span id="brainStatusDot" class="status-dot"></span>
            <span id="brainStatusText">Julia Brain</span>
          </button>
        </div>
      </header>

      <main class="surface-root">
        <section id="textSurface" class="surface text-surface" aria-label="Text mode">
          <aside class="sidebar">
            <button id="newChatButton" class="new-chat-button" type="button">+ New Chat</button>
            <label class="search-label" for="conversationSearch">Search</label>
            <input id="conversationSearch" class="search-input" placeholder="Search conversations" />

            <div id="conversationList" class="conversation-list">
            </div>

            <div id="emptyConversationList" class="conversation-group muted">
              <div class="group-title">Today</div>
              <div class="empty-sidebar">No saved conversations yet.</div>
            </div>
          </aside>

          <section class="conversation-panel">
            <div id="conversationThread" class="thread">
            </div>

            <form id="composerForm" class="composer">
              <button class="composer-plus" type="button" aria-label="Attach" disabled>+</button>
              <input id="composerInput" class="composer-input" placeholder="Message Julia..." autocomplete="off" />
              <button id="composerVoiceButton" class="composer-voice" type="button" aria-label="Switch to voice">🎙</button>
              <button id="composerSend" class="composer-send" type="submit" disabled>↑</button>
            </form>
          </section>
        </section>

        <section id="voiceSurface" class="surface voice-surface hidden" aria-label="Voice mode">
          <button id="backToTextButton" class="back-button" type="button">← Text</button>
          <div class="voice-center">
            <div class="voice-orb" aria-hidden="true"></div>
            <h1>Julia Voice</h1>
            <p class="voice-state">Validated Golden Voice Shell</p>
            <p class="voice-note">
              Voice is still served by the existing HF Web Voice path. This App Shell does not transport audio.
            </p>
            <button id="openVoiceButton" class="primary-action" type="button">Open Voice Shell</button>
            <div id="voiceUrlLabel" class="voice-url"></div>
          </div>
        </section>
      </main>

      <section id="settingsPanel" class="settings-panel hidden" aria-label="Settings">
        <div class="settings-card">
          <div class="settings-header">
            <div>
              <h2>Settings</h2>
              <p>Desktop preferences for Julia Electron V2.</p>
            </div>
            <button id="settingsCloseButton" class="settings-close" type="button">×</button>
          </div>

          <div class="settings-grid">
            <div class="settings-section">
              <h3>General</h3>
              <label>
                Default mode
                <select id="defaultModeSetting">
                  <option value="text">Text</option>
                  <option value="voice">Voice</option>
                </select>
              </label>
              <label>
                Close behavior
                <select id="closeBehaviorSetting">
                  <option value="tray">Hide to tray</option>
                  <option value="quit">Quit app</option>
                </select>
              </label>
              <label class="checkbox-row">
                <input id="launchAtLoginSetting" type="checkbox" />
                Launch Julia at login
              </label>
            </div>

            <div class="settings-section">
              <h3>Julia</h3>
              <label>
                Brain endpoint
                <input id="brainEndpointSetting" type="url" spellcheck="false" />
              </label>
              <div id="brainStatusDetails" class="settings-status">Checking Julia Brain…</div>
              <button id="refreshBrainStatusButton" class="secondary-action" type="button">Refresh status</button>
            </div>

            <div class="settings-section">
              <h3>Desktop</h3>
              <label>
                Global shortcut
                <input id="globalShortcutSetting" type="text" spellcheck="false" />
              </label>
              <label class="checkbox-row">
                <input id="windowRestoreSetting" type="checkbox" />
                Restore window size and position
              </label>
              <label class="checkbox-row">
                <input id="trayEnabledSetting" type="checkbox" />
                Enable tray menu
              </label>
            </div>
          </div>

          <div id="settingsError" class="settings-error hidden"></div>
          <div class="settings-footer">
            <button id="settingsCancelButton" class="secondary-action" type="button">Cancel</button>
            <button id="settingsSaveButton" class="primary-action" type="button">Save settings</button>
          </div>
        </div>
      </section>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
